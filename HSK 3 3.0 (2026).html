<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSK 3 Quiz — Hanzi, Pinyin & Arti</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:18px;
    background:linear-gradient(160deg,#eef2ff 0%,#f8fafc 45%,#fdf2f8 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    color:#1e293b;
  }
  .app{width:100%;max-width:600px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  h1{font-size:19px;margin:0;letter-spacing:.3px}
  h1 span{color:#4f46e5}
  .stats{display:flex;gap:14px;font-size:13px;color:#475569}
  .stats b{color:#0f172a}
  .modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .modes button{
    flex:1 1 auto;padding:9px 10px;border-radius:10px;border:1px solid #e2e8f0;
    background:#fff;color:#475569;font-size:12.5px;font-weight:600;cursor:pointer;
    transition:.15s;white-space:nowrap;
  }
  .modes button:hover{border-color:#c7d2fe}
  .modes button.active{background:#4f46e5;border-color:#4f46e5;color:#fff;box-shadow:0 6px 16px -6px #4f46e5}
  .card{
    background:#fff;border-radius:20px;padding:22px 20px 18px;
    box-shadow:0 20px 45px -20px rgba(15,23,42,.25),0 2px 8px rgba(15,23,42,.05);
    border:1px solid #eef2f7;
  }
  .prompt{
    text-align:center;font-weight:700;line-height:1.25;
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .prompt.hanzi{font-size:clamp(48px,15vw,76px);letter-spacing:4px}
  .prompt.pinyin{font-size:clamp(30px,9.5vw,46px);color:#4f46e5;letter-spacing:1px;font-family:inherit}
  .sub{text-align:center;color:#94a3b8;font-size:13.5px;margin:8px 0 20px;min-height:19px}
  .options{display:grid;gap:9px}
  .option{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
    padding:13px 15px;border-radius:13px;border:1.5px solid #e6eaf2;background:#fbfcfe;
    font-size:16px;color:#1e293b;font-weight:500;transition:.15s;font-family:inherit;
  }
  .option:hover:not(:disabled){border-color:#a5b4fc;background:#f5f7ff;transform:translateY(-1px)}
  .option:disabled{cursor:default}
  .option .key{
    flex:0 0 24px;height:24px;border-radius:7px;background:#eef2ff;color:#4f46e5;
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .option.hanzi-opt .txt{font-size:26px;font-family:"Noto Sans SC","PingFang SC",sans-serif}
  .option.correct{border-color:#10b981;background:#ecfdf5;color:#065f46}
  .option.correct .key{background:#10b981;color:#fff}
  .option.wrong{border-color:#ef4444;background:#fef2f2;color:#991b1b}
  .option.wrong .key{background:#ef4444;color:#fff}
  .feedback{margin-top:16px;padding:0 14px;border-radius:13px;max-height:0;overflow:hidden;
    opacity:0;transition:.25s ease;border:1.5px solid transparent}
  .feedback.show{max-height:240px;opacity:1;padding:13px 14px}
  .feedback.ok{background:#ecfdf5;border-color:#a7f3d0}
  .feedback.no{background:#fef2f2;border-color:#fecaca}
  .fb-title{font-size:13px;font-weight:700;margin-bottom:7px}
  .feedback.ok .fb-title{color:#047857}
  .feedback.no .fb-title{color:#b91c1c}
  .fb-detail{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .d-hz{font-size:27px;font-weight:700;font-family:"Noto Sans SC","PingFang SC",sans-serif}
  .d-py{font-size:16px;color:#4f46e5;font-weight:600}
  .d-pos{font-size:11.5px;color:#64748b;background:#f1f5f9;padding:2px 7px;border-radius:6px}
  .d-en{font-size:14px;color:#334155}
  .next{
    display:block;width:100%;margin-top:14px;padding:14px;border-radius:13px;border:none;
    background:#4f46e5;color:#fff;font-size:15.5px;font-weight:700;cursor:pointer;
    transition:.15s;font-family:inherit;
  }
  .next:hover{background:#4338ca;transform:translateY(-1px)}
  .footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;
    font-size:12px;color:#94a3b8;gap:10px;flex-wrap:wrap}
  .footer button{background:none;border:none;color:#94a3b8;font-size:12px;cursor:pointer;
    text-decoration:underline;font-family:inherit}
  .footer button:hover{color:#4f46e5}
  @media(max-width:420px){ .card{padding:18px 15px 15px} .stats{gap:10px;font-size:12px} }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>HSK 3 <span>Quiz</span></h1>
    <div class="stats">
      <span>Skor <b id="score">0</b>/<b id="total">0</b></span>
      <span>Akurasi <b id="acc">–</b></span>
      <span>Streak <b id="streak">0</b></span>
    </div>
  </header>

  <div class="modes" id="modes">
    <button data-mode="pinyin" class="active">Hanzi → Pinyin</button>
    <button data-mode="meaning">Hanzi → Arti</button>
    <button data-mode="hanzi">Pinyin+Arti → Hanzi</button>
    <button data-mode="mix">🎲 Campur</button>
  </div>

  <div class="card">
    <div class="prompt hanzi" id="prompt">安静</div>
    <div class="sub" id="sub">Bagaimana cara membacanya (pinyin)?</div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next" id="next" hidden>Lanjut →</button>
  </div>

  <div class="footer">
    <span id="counter">Soal ke-0</span>
    <span id="bank">Bank kata: 0</span>
    <button id="reset">Ulangi dari awal</button>
  </div>
</div>

/* ====== SETUP ====== */
const WORDS = RAW.map((r,i)=>({id:i, w:r[0], p:r[1], pos:r[2], e:r[3]}));
const $ = s => document.querySelector(s);
const promptEl = $('#prompt'), subEl = $('#sub'), optionsEl = $('#options');
const feedbackEl = $('#feedback'), nextBtn = $('#next');
const scoreEl = $('#score'), totalEl = $('#total'), accEl = $('#acc'), streakEl = $('#streak');
const counterEl = $('#counter'), bankEl = $('#bank');

let mode = 'pinyin';
let queue = [];
let cur = null;
let answered = false;
let score = 0, total = 0, streak = 0, bestStreak = 0;

const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const labelOf = (w, m) => m === 'pinyin' ? w.p : m === 'meaning' ? w.e : w.w;

/* ====== GAME ====== */
function nextQuestion(){
  if(queue.length === 0) queue = shuffle(WORDS.slice());
  const target = queue.pop();
  const qmode = mode === 'mix' ? pick(['pinyin','meaning','hanzi']) : mode;

  let pool = WORDS.filter(w =>
    w.id !== target.id &&
    w.p !== target.p &&
    w.e !== target.e &&
    w.w !== target.w
  );
  if(pool.length < 3) pool = WORDS.filter(w => w.id !== target.id);

  const others = shuffle(pool.slice()).slice(0,3);
  const options = shuffle([target, ...others]);

  cur = { target, qmode, options };
  answered = false;
  render();
}

function render(){
  const { target, qmode, options } = cur;
  feedbackEl.className = 'feedback';
  feedbackEl.innerHTML = '';
  nextBtn.hidden = true;

  if(qmode === 'pinyin'){
    promptEl.textContent = target.w;
    promptEl.className = 'prompt hanzi';
    subEl.textContent = 'Bagaimana cara membacanya (pinyin)?';
  } else if(qmode === 'meaning'){
    promptEl.textContent = target.w;
    promptEl.className = 'prompt hanzi';
    subEl.textContent = 'Apa arti kata ini dalam bahasa Inggris?';
  } else {
    promptEl.textContent = target.p;
    promptEl.className = 'prompt pinyin';
    subEl.textContent = target.e + ' — pilih hanzi yang tepat';
  }

  optionsEl.innerHTML = '';
  options.forEach((w, i) => {
    const btn = document.createElement('button');
    btn.className = 'option' + (qmode === 'hanzi' ? ' hanzi-opt' : '');
    btn.innerHTML = '<span class="key">' + (i+1) + '</span><span class="txt"></span>';
    btn.querySelector('.txt').textContent = labelOf(w, qmode);
    btn.addEventListener('click', () => choose(w, btn));
    optionsEl.appendChild(btn);
  });
}

function choose(chosen, btn){
  if(answered) return;
  answered = true;

  const correct = chosen.id === cur.target.id;
  total++;
  if(correct){ score++; streak++; bestStreak = Math.max(bestStreak, streak); }
  else { streak = 0; }

  Array.from(optionsEl.children).forEach((b, i) => {
    const w = cur.options[i];
    b.disabled = true;
    if(w.id === cur.target.id) b.classList.add('correct');
    else if(b === btn) b.classList.add('wrong');
  });

  const t = cur.target;
  feedbackEl.className = 'feedback show ' + (correct ? 'ok' : 'no');
  feedbackEl.innerHTML =
    '<div class="fb-title">' + (correct ? '✓ Benar!' : '✗ Kurang tepat') + '</div>' +
    '<div class="fb-detail">' +
      '<span class="d-hz"></span>' +
      '<span class="d-py"></span>' +
      '<span class="d-pos"></span>' +
      '<span class="d-en"></span>' +
    '</div>';
  feedbackEl.querySelector('.d-hz').textContent = t.w;
  feedbackEl.querySelector('.d-py').textContent = t.p;
  feedbackEl.querySelector('.d-pos').textContent = t.pos;
  feedbackEl.querySelector('.d-en').textContent = t.e;

  updateStats();
  nextBtn.hidden = false;
  nextBtn.focus({ preventScroll: true });
}

function updateStats(){
  scoreEl.textContent = score;
  totalEl.textContent = total;
  accEl.textContent = total ? Math.round(score / total * 100) + '%' : '–';
  streakEl.textContent = streak;
  counterEl.textContent = 'Soal ke-' + total + ' · Terbaik: ' + bestStreak + ' streak';
}

function resetSession(){
  queue = [];
  score = 0; total = 0; streak = 0; bestStreak = 0;
  updateStats();
  nextQuestion();
}

/* ====== EVENTS ====== */
nextBtn.addEventListener('click', nextQuestion);

document.querySelectorAll('#modes button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#modes button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    mode = b.dataset.mode;
    resetSession();
  });
});

$('#reset').addEventListener('click', resetSession);

document.addEventListener('keydown', e => {
  if(!answered && ['1','2','3','4'].includes(e.key)){
    const btn = optionsEl.children[Number(e.key) - 1];
    if(btn && !btn.disabled) btn.click();
  } else if(answered && (e.key === 'Enter' || e.key === ' ')){
    e.preventDefault();
    nextQuestion();
  }
});

/* start */
bankEl.textContent = 'Bank kata: ' + WORDS.length;
resetSession();
</script>
</body>
</html>
